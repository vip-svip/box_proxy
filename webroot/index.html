<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Box Proxy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="scan" onclick="triggerImportLocal()" title="导入本地文件">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><path d="M3 12h18"/>
      </svg>
    </div>
    <h1 id="title">配置</h1>
    <div class="plus" id="addBtn" onclick="openImport()">＋</div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <a data-tab="home"   onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>首页</span></a>
    <a data-tab="config" class="active" onclick="go('config')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>
      <span>配置</span></a>
    <a data-tab="data"   onclick="go('data')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-5 3 10 2-5h5"/></svg>
      <span>数据</span></a>
    <a data-tab="setting" onclick="go('setting')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      <span>设置</span></a>
  </nav>
</div>

<input type="file" id="fileInput" accept=".yaml,.yml,.conf,.txt,.json" hidden onchange="onLocalFile(event)">
<script src="app.js"></script>
</body>
</html>
